<svg width="1160" height="340" viewBox="0 0 1160 340" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="45%" stop-color="#0b1535"/>
      <stop offset="75%" stop-color="#111d4d"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <!-- Cyan glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#6ee7ff" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#4f7cff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>

    <!-- Radar sweep -->
    <linearGradient
      id="sweepGrad"
      x1="0"
      y1="0"
      x2="0"
      y2="-48"
      gradientUnits="userSpaceOnUse">

      <stop offset="0%" stop-color="#6ee7ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6ee7ff" stop-opacity="0.85"/>

    </linearGradient>

    <!-- Terminal reveal animation -->
    <clipPath id="reveal">

      <rect x="0" y="0" width="0" height="340">

        <animate
          attributeName="width"
          values="0;1160;1160;0;0"
          keyTimes="0;0.22;0.78;0.96;1"
          dur="7s"
          repeatCount="indefinite"/>

      </rect>

    </clipPath>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect
    width="1160"
    height="340"
    rx="16"
    fill="url(#bg)"/>


  <!-- Border -->

  <rect
    x="1"
    y="1"
    width="1158"
    height="338"
    rx="15"
    fill="none"
    stroke="#6ee7ff"
    stroke-opacity="0.35"
    stroke-width="1.5"/>


  <!-- ===================================================== -->
  <!-- HUD CORNER BRACKETS -->
  <!-- ===================================================== -->

  <g
    stroke="#6ee7ff"
    stroke-width="2.5"
    fill="none"
    opacity="0.75"
    stroke-linecap="round">

    <path d="M22,26 L22,50 M22,26 L46,26"/>

    <path d="M1138,26 L1138,50 M1138,26 L1114,26"/>

    <path d="M22,314 L22,290 M22,314 L46,314"/>

    <path d="M1138,314 L1138,290 M1138,314 L1114,314"/>

  </g>


  <!-- ===================================================== -->
  <!-- AI / SYSTEM CORE -->
  <!-- ===================================================== -->

  <g transform="translate(1058,170)">

    <!-- Outer housing -->

    <circle
      r="50"
      fill="#030712"
      opacity="0.6"/>

    <circle
      r="48"
      fill="none"
      stroke="#6ee7ff"
      stroke-width="2"
      opacity="0.6"/>

    <circle
      r="38"
      fill="none"
      stroke="#8b9cff"
      stroke-width="1.2"
      opacity="0.55"/>


    <!-- Tick marks -->

    <g
      stroke="#6ee7ff"
      stroke-width="1.5"
      opacity="0.65">

      <line x1="0" y1="-48" x2="0" y2="-41"/>

      <line
        x1="0"
        y1="-48"
        x2="0"
        y2="-41"
        transform="rotate(45)"/>

      <line
        x1="0"
        y1="-48"
        x2="0"
        y2="-41"
        transform="rotate(90)"/>

      <line
        x1="0"
        y1="-48"
        x2="0"
        y2="-41"
        transform="rotate(135)"/>

      <line
        x1="0"
        y1="-48"
        x2="0"
        y2="-41"
        transform="rotate(180)"/>

      <line
        x1="0"
        y1="-48"
        x2="0"
        y2="-41"
        transform="rotate(225)"/>

      <line
        x1="0"
        y1="-48"
        x2="0"
        y2="-41"
        transform="rotate(270)"/>

      <line
        x1="0"
        y1="-48"
        x2="0"
        y2="-41"
        transform="rotate(315)"/>

    </g>


    <!-- Rotating radar -->

    <g>

      <path
        d="M0,0 L0,-48 A48,48 0 0 1 24,-41.6 Z"
        fill="url(#sweepGrad)"/>

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="4s"
        repeatCount="indefinite"/>

    </g>


    <!-- Energy core -->

    <circle
      r="22"
      fill="url(#coreGlow)">

      <animate
        attributeName="r"
        values="18;25;18"
        dur="2.2s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0.6;1;0.6"
        dur="2.2s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Core -->

    <circle
      r="13"
      fill="#030712"
      stroke="#eafcff"
      stroke-width="1.5"/>


    <!-- AI symbol -->

    <path
      d="M0,-7 L6,3.5 L-6,3.5 Z"
      fill="#eafcff"/>

  </g>


  <!-- ===================================================== -->
  <!-- TERMINAL CONTENT -->
  <!-- ===================================================== -->

  <g
    clip-path="url(#reveal)"
    font-family="'Fira Code','Cascadia Code',Consolas,Menlo,monospace">


    <!-- Terminal command -->

    <text
      x="40"
      y="56"
      font-size="19"
      font-weight="700"
      fill="#6ee7ff">

      rohith@dev-system:~$ cat about_me.txt

    </text>


    <!-- NAME -->

    <text
      x="40"
      y="98"
      font-size="15"
      fill="#e5f7ff">

      <tspan fill="#7dd3fc">name</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>HM Rohith</tspan>

    </text>


    <!-- ROLE -->

    <text
      x="40"
      y="126"
      font-size="15"
      fill="#e5f7ff">

      <tspan fill="#7dd3fc">role</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>Full-Stack Software Engineer</tspan>

    </text>


    <!-- LOCATION -->

    <text
      x="40"
      y="154"
      font-size="15"
      fill="#e5f7ff">

      <tspan fill="#7dd3fc">based_in</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>Mysore, Karnataka, India</tspan>

    </text>


    <!-- FOCUS -->

    <text
      x="40"
      y="182"
      font-size="15"
      fill="#e5f7ff">

      <tspan fill="#7dd3fc">focus</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>[AI/LLMs, Full-Stack, IoT, Cloud, System Design]</tspan>

    </text>


    <!-- STACK -->

    <text
      x="40"
      y="210"
      font-size="15"
      fill="#e5f7ff">

      <tspan fill="#7dd3fc">stack</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>[React, Next.js, Node.js, Python, MongoDB, PostgreSQL, AWS]</tspan>

    </text>


    <!-- PROJECTS -->

    <text
      x="40"
      y="238"
      font-size="15"
      fill="#e5f7ff">

      <tspan fill="#7dd3fc">projects</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>AI applications, RAG systems &amp; intelligent IoT solutions</tspan>

    </text>


    <!-- CURRENT -->

    <text
      x="40"
      y="266"
      font-size="15"
      fill="#e5f7ff">

      <tspan fill="#7dd3fc">currently_building</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>AI-powered systems &amp; real-world software products</tspan>

    </text>


    <!-- OPEN TO -->

    <text
      x="40"
      y="294"
      font-size="15"
      fill="#e5f7ff">

      <tspan fill="#7dd3fc">open_to</tspan>
      <tspan fill="#64748b">: </tspan>
      <tspan>Full-time software engineering &amp; AI opportunities</tspan>

    </text>


  </g>

</svg>
